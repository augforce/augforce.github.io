<section class="section section--experience" id="experience">
  <div class="container">
    <p class="section__label" data-reveal>// 04 — Experience</p>
    <h2 class="section__title" data-reveal>Where I've worked</h2>

    <div class="timeline">
      {% for job in site.data.experience %}
      <article class="job" data-reveal>
        <div class="job__head">
          <h3 class="job__role">{{ job.role }}</h3>
          <span class="job__meta">{{ job.org }}{% if job.location %} · {{ job.location }}{% endif %}</span>
        </div>
        <span class="job__dates">{{ job.dates }}</span>
        <ul class="job__points">
          {% for pt in job.points %}<li>{{ pt }}</li>{% endfor %}
        </ul>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
