<section class="section section--verticals" id="focus">
  <div class="container">
    <p class="section__label" data-reveal>// 01 — Who I build for</p>
    <h2 class="section__title" data-reveal>Focused on four high-value niches</h2>

    <div class="verticals">
      {% for v in site.data.verticals %}
      <article class="vertical" data-reveal>
        <h3 class="vertical__name">{{ v.name }}</h3>
        <p class="vertical__blurb">{{ v.blurb }}</p>
        {% if v.note %}<span class="vertical__note">{{ v.note }}</span>{% endif %}
      </article>
      {% endfor %}
    </div>

    <p class="verticals__foot" data-reveal>
      Need something outside these four? I build custom AI tools too — the same way:
      in your voice, on your own infrastructure.
    </p>
  </div>
</section>
