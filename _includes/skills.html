<section class="section section--skills" id="skills">
  <div class="container">
    <p class="section__label" data-reveal>// 02 — Capabilities</p>
    <h2 class="section__title" data-reveal>What I work with</h2>

    <div class="skills">
      {% for g in site.data.skills %}
      <div class="skills__group" data-reveal>
        <h3 class="skills__group-title">{{ g.group }}</h3>
        <ul class="chips">{% for i in g.items %}<li>{{ i }}</li>{% endfor %}</ul>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
