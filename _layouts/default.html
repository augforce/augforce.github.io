<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }} — {{ site.tagline }}</title>
  <meta name="description" content="{{ site.description }}">

  <!-- Flag JS as available so we never hide content from no-JS visitors -->
  <script>document.documentElement.className = document.documentElement.className.replace('no-js', 'js');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Sora:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {% include nav.html %}

  <main>
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>© {{ 'now' | date: '%Y' }} Michael Augustine</span>
      <span class="footer__meta">Built with Jekyll · Hosted on GitHub Pages</span>
      <a href="#top" class="footer__top">Back to top ↑</a>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
